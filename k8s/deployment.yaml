
apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-backend

  template:
    metadata:
      labels:
        app: student-backend

    spec:
      containers:
        - name: student-backend
          image: student-backend:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
